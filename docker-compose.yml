services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nazar
      POSTGRES_PASSWORD: nazar
      POSTGRES_DB: nazar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazar -d nazar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nazar:nazar@db:5432/nazar
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      RULES_PATH: /app/rules/triage.yaml
      MEDGEMMA_URL: http://medgemma:8001
      DEMO_DATA_PATH: /app/demo-data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./demo-data:/app/demo-data:ro
      - storage:/data/storage
      - xrv-weights:/root/.torchxrayvision
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nazar:nazar@db:5432/nazar
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      RULES_PATH: /app/rules/triage.yaml
      MEDGEMMA_URL: http://medgemma:8001
      DEMO_DATA_PATH: /app/demo-data
    command: celery -A app.workers.tasks worker -l info
    volumes:
      - ./backend/app:/app/app
      - ./demo-data:/app/demo-data:ro
      - storage:/data/storage
      - xrv-weights:/root/.torchxrayvision
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # medgemma: added in step 5 (medgemma-service/)
  # web:      added in step 10 (specialist-panel/)

volumes:
  pgdata:
  storage:
  xrv-weights:   # cached torchxrayvision model weights (~30 MB), downloaded once
